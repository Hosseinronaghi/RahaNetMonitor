name: Build Raha Net Monitor
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release source
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check release manifest
        run: python tests/check_release.py
  windows:
    needs: source-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/RahaNetMonitor/RahaNetMonitor.csproj
      - name: Publish Windows x64
        run: dotnet publish windows/RahaNetMonitor/RahaNetMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows-publish
      - uses: actions/upload-artifact@v4
        with:
          name: RahaNetMonitor-windows-x64-rc1
          path: windows-publish/
  android:
    needs: source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android lint
        working-directory: android
        run: gradle --no-daemon lintDebug
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RahaNetMonitor-android-debug-rc1
          path: android/app/build/outputs/apk/debug/*.apk
